name: Sync from nostr-ride

on:
  workflow_dispatch:
    inputs:
      ref:
        description: nostr-ride branch or tag
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: sync-from-nostr-ride
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export from nostr-ride
        env:
          REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nostr-ride /tmp/export
          git clone --depth 1 --branch "$REF" https://github.com/trevthom/nostr-ride.git /tmp/nostr-ride
          node /tmp/nostr-ride/scripts/export-apps.mjs --only rider --out /tmp/export
          rsync -a --delete --exclude '.git' --exclude '.github' /tmp/export/nostr-ride-rider/ ./
      - name: Check the exported app
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "NostrRide export"
          git config user.email "noreply@nostr-ride.invalid"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          SRC=$(git -C /tmp/nostr-ride rev-parse --short HEAD)
          git commit -m "Export from trevthom/nostr-ride @ $SRC" -m "Generated by scripts/export-apps.mjs. Change the code in nostr-ride, not here."
          git push origin HEAD:main
